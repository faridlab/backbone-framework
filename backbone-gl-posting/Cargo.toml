[package]
name = "backbone-gl-posting"
version = "2.7.36"
edition = "2021"
description = "Wire contracts shared across Backbone producers: the GL-posting envelope + sink port, and the reconciliation edge port."
license = "MIT OR Apache-2.0"
repository = "https://github.com/faridlab/backbone-framework"

[lib]
path = "src/lib.rs"

[dependencies]
# Only the wire types — no backbone deps, so this composes everywhere with zero version skew
# (same posture as backbone-outbox: framework plumbing that depends on sqlx/serde only).
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
async-trait = "0.1"
# PgConnection for the connection-taking ReconcileSink port (the sink rides the caller's
# transaction; no pooling/runtime features needed here — consumers bring their own runtime).
sqlx = { version = "0.8", default-features = false, features = ["postgres"] }
