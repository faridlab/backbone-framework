[workspace]
resolver = "2"
members = [
    "backbone-auth",
    "backbone-authorization",
    "backbone-cache",
    "backbone-core",
    "backbone-email",
    "backbone-gl-posting",
    "backbone-graphql",
    "backbone-health",
    "backbone-jobs",
    "backbone-maintenance",
    "backbone-messaging",
    "backbone-observability",
    "backbone-orm",
    "backbone-outbox",
    "backbone-queue",
    "backbone-rate-limit",
    "backbone-search",
    "backbone-storage",
    "backbone-tenant",
]

# Each member crate keeps its own dependency declarations. There is intentionally
# no [workspace.dependencies] table — every crate was self-describing in
# monorepo-backbone (no workspace inheritance), so we preserve that property
# during extraction. Lift-and-shift discipline: the source files inside each
# member directory are byte-for-byte unchanged from monorepo-backbone.

# Distribution model (metaphora ADR-0030): every member crate is published to
# crates.io at this one release version, and consumers depend on it by semver
# requirement (`backbone-core = "2.7"`). To release, run
# scripts/set-release-version.sh <version> and merge to main: the release
# workflow (.github/workflows/release.yml) tests the workspace, publishes the
# crates not yet on crates.io at this version, and then tags v<version>.
[workspace.metadata.release]
version = "3.2.0"
