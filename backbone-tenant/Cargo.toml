[package]
name = "backbone-tenant"
version = "0.1.0"
edition = "2021"
description = "Per-tenant runtime registry: resolve a request to its tenant's runtime (pool + built modules), building each tenant once and caching it (ADR-0006)."

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync"] }

# Provisioning (feature `provision`): create + migrate a tenant's database. Off by default so the
# routing registry stays generic and free of a database dependency; a composition root that
# provisions tenants enables it.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"], optional = true }

# The host-routing middleware (feature `axum`): resolve the request's tenant and dispatch into its
# runtime. Pulls sqlx only for the `ProvidesDatabase` hand-off of the tenant pool to the auth
# layers.
axum = { version = "0.7", optional = true }
serde_json = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = []
provision = ["dep:sqlx", "dep:tracing"]
axum = ["dep:axum", "dep:serde_json", "dep:tracing", "dep:sqlx"]

[dev-dependencies]
tokio = { version = "1.0", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
async-trait = "0.1"
thiserror = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1.0", features = ["v4"] }
jsonwebtoken = "9.0"
# The live router test wires the production stack end-to-end: this crate's router hands the
# tenant pool to backbone-auth's org guard, which scopes it via backbone-orm.
backbone-auth = { path = "../backbone-auth", features = ["axum"] }
backbone-orm = { path = "../backbone-orm" }
